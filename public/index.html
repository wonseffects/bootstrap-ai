<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BootstrapBot - Especialista em Bootstrap</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Tela de Login/Cadastro -->
    <div id="login-view" class="vh-100 d-flex justify-content-center align-items-center bg-light">
        <div class="card shadow-lg" style="width: 100%; max-width: 400px;">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">
                    <i class="bi bi-code-slash"></i> BootstrapBot
                </h3>
                <p class="text-center text-muted">Faça login para conversar</p>
                <form id="auth-form">
                    <div class="mb-3">
                        <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" class="form-control" id="password" placeholder="Sua senha" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary" id="auth-btn">Entrar</button>
                        <button type="button" class="btn btn-link" id="toggle-signup">Não tem uma conta? Cadastre-se</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Tela do Chat -->
    <div id="chat-view" class="vh-100 d-flex flex-column" style="display: none;">
        <header class="bg-primary text-white p-3 shadow-sm">
            <div class="container-fluid d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-robot"></i> BootstrapBot</h5>
                <button class="btn btn-outline-light btn-sm" id="logout-btn">
                    <i class="bi bi-box-arrow-right"></i> Sair
                </button>
            </div>
        </header>

        <main class="flex-grow-1 overflow-auto p-3" id="chat-messages">
            <!-- Mensagens aparecerão aqui -->
            <div class="text-center text-muted mt-5">
                <i class="bi bi-chat-dots" style="font-size: 3rem;"></i>
                <p>Olá! Como posso ajudar você com Bootstrap hoje?</p>
            </div>
        </main>

        <footer class="bg-light border-top p-3">
            <form id="message-form" class="container-fluid">
                <div class="input-group">
                    <input type="text" class="form-control" id="message-input" placeholder="Digite sua pergunta sobre Bootstrap..." autocomplete="off" required>
                    <button class="btn btn-primary" type="submit" id="send-btn">
                        <i class="bi bi-send-fill"></i>
                    </button>
                </div>
            </form>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
